<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Medical Supply Ward 15E</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
:root{
  --navy:#183153;
  --blue:#2455A6;
  --bg:#EEF3FA;
  --card:#FFFFFF;
  --border:#D7E0EF;
  --text:#1B2B3D;
  --green:#15803d;
  --red:#dc2626;
}

*{ margin:0; padding:0; box-sizing:border-box; font-family:'Sarabun',sans-serif; }

body{ background:var(--bg); color:var(--text); }

/* ===== TOPBAR ===== */
.topbar{
  background:linear-gradient(135deg,var(--navy),var(--blue));
  padding:12px 14px;
  color:#fff;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 3px 10px rgba(0,0,0,.2);
}
.title{ font-size:1rem; font-weight:800; }
.sub{ font-size:.75rem; opacity:.85; margin-top:2px; }
.shift-tabs{ display:flex; gap:8px; margin-top:10px; }
.shift-btn{
  flex:1; border:none; border-radius:10px; padding:9px;
  font-weight:700; font-size:.85rem;
  background:rgba(255,255,255,.15); color:#fff; cursor:pointer;
  font-family:'Sarabun',sans-serif;
}
.shift-btn.active{ background:#fff; color:var(--navy); }

/* ===== NAV ===== */
.nav{
  display:flex; background:#fff;
  border-bottom:1px solid var(--border);
  position:sticky; top:102px; z-index:90;
}
.nav button{
  flex:1; padding:11px; border:none; background:#fff;
  font-weight:700; font-size:.88rem; cursor:pointer;
  color:#64748b; border-bottom:3px solid transparent;
  font-family:'Sarabun',sans-serif;
}
.nav button.active{ color:var(--blue); border-color:var(--blue); }

/* ===== MAIN ===== */
.main{ padding:12px; max-width:700px; margin:auto; }

.card{
  background:var(--card); border:1px solid var(--border);
  border-radius:14px; padding:13px; margin-bottom:13px;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.field{ margin-bottom:11px; }
.field label{
  display:block; font-size:.82rem; font-weight:700;
  margin-bottom:5px; color:var(--navy);
}
.field input,
.field textarea{
  width:100%; padding:9px 10px;
  border:1px solid var(--border); border-radius:10px;
  background:#F7FAFF; font-size:.9rem;
  font-family:'Sarabun',sans-serif;
}

/* ===== TABLE – Mobile Optimized ===== */
.table-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; }

table{ width:100%; border-collapse:collapse; }

thead{ background:var(--blue); color:#fff; }

th{
  padding:8px 4px;
  font-size:.7rem;
  border:1px solid rgba(255,255,255,.15);
  white-space:nowrap;
}

/* คอลัมน์ความกว้าง */
th:nth-child(1), td:nth-child(1){ width:40%; min-width:110px; }
th:nth-child(2), td:nth-child(2){ width:15%; }
th:nth-child(3), td:nth-child(3){ width:22%; }
th:nth-child(4), td:nth-child(4){ width:23%; }

td{
  padding:5px 4px;
  border:1px solid #E2E8F0;
  font-size:.72rem;
  background:#fff;
  text-align:center;
  vertical-align:middle;
}
td:first-child{
  text-align:left;
  word-break:break-word;
  white-space:normal;
  line-height:1.4;
}
tbody tr:nth-child(even) td{ background:#F9FBFF; }

.input{
  width:100%; padding:5px 4px;
  border:1px solid var(--border); border-radius:7px;
  font-size:.72rem; background:#F8FBFF;
  font-family:'Sarabun',sans-serif;
  text-align:center;
}

/* ===== RADIO ครบ / ไม่ครบ ===== */
.ck-group{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:4px;
}
.ck-group label{
  display:flex;
  align-items:center;
  gap:6px;
  font-weight:700;
  font-size:.88rem;
  cursor:pointer;
  padding:8px 14px;
  border-radius:10px;
  border:2px solid var(--border);
  background:#F7FAFF;
  user-select:none;
  transition:all .15s;
}
.ck-group label:has(input:checked){
  border-color:var(--blue);
  background:#DBEAFE;
}
.ck-group input[type="radio"]{
  width:16px; height:16px;
  accent-color:var(--blue);
  cursor:pointer;
  flex-shrink:0;
}
.badge-ok{ color:var(--green); }
.badge-ng{ color:var(--red); }

/* ===== BUTTONS ===== */
.btn-row{ display:flex; gap:10px; margin-top:13px; }
.btn{
  flex:1; padding:12px; border:none; border-radius:10px;
  font-weight:700; font-size:.9rem; cursor:pointer;
  font-family:'Sarabun',sans-serif;
}
.save{ background:var(--navy); color:#fff; }
.clear{ background:#fff; border:1px solid var(--border); color:var(--text); }

/* ===== HISTORY ===== */
.history-card{
  background:#fff; border:1px solid var(--border);
  border-radius:14px; padding:13px; margin-bottom:13px;
}
.flex{
  display:flex; justify-content:space-between;
  align-items:center; gap:10px; margin-bottom:10px;
}
.small-btn{
  border:none; padding:7px 10px; border-radius:8px;
  font-size:.73rem; font-weight:700; cursor:pointer;
  font-family:'Sarabun',sans-serif;
}
.edit{ background:#DBEAFE; color:#1D4ED8; }
.delete{ background:#FEE2E2; color:#B91C1C; }

/* ===== TOAST ===== */
#toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  background:#183153; color:#fff; padding:10px 20px;
  border-radius:20px; font-size:.85rem; font-weight:700;
  opacity:0; transition:opacity .3s; pointer-events:none; z-index:999;
  white-space:nowrap;
}
#toast.show{ opacity:1; }

@media(max-width:380px){
  th,td{ font-size:.65rem; }
  .input{ font-size:.65rem; }
}
</style>
</head>

<body>

<div class="topbar">
  <div class="title">📋 ใบตรวจนับ Medical Supply</div>
  <div class="sub">Ward 15E – Bangkok Hospital Pattaya</div>
  <div class="shift-tabs">
    <button class="shift-btn active" id="dayBtn" onclick="setShift('07-19')">☀️ เวร 07-19</button>
    <button class="shift-btn" id="nightBtn" onclick="setShift('19-07')">🌙 เวร 19-07</button>
  </div>
</div>

<div class="nav">
  <button class="active" id="formTab" onclick="showPage('form')">📝 บันทึก</button>
  <button id="historyTab" onclick="showPage('history')">🗂 ย้อนหลัง</button>
</div>

<!-- FORM PAGE -->
<div class="main" id="formPage">

  <div class="card">
    <div class="field">
      <label>วันที่</label>
      <input type="date" id="date">
    </div>
    <div class="field">
      <label>Team A</label>
      <input type="text" id="teamA" placeholder="ชื่อ Team A">
    </div>
    <div class="field">
      <label>Team B</label>
      <input type="text" id="teamB" placeholder="ชื่อ Team B">
    </div>
  </div>

  <div class="card">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>รายการ</th>
            <th>Stock</th>
            <th>จำนวนนับ</th>
            <th>เบิกใช้ห้อง</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <div class="field">
      <label>สรุปผลการตรวจนับ</label>
      <div class="ck-group">
        <label>
          <input type="radio" name="summary" value="ครบ" id="summary_ok">
          <span class="badge-ok">✅ ครบ</span>
        </label>
        <label>
          <input type="radio" name="summary" value="ไม่ครบ" id="summary_ng">
          <span class="badge-ng">❌ ไม่ครบ</span>
        </label>
      </div>
    </div>

    <div class="field">
      <label>รายการที่หายไป / หมายเหตุ</label>
      <textarea id="missing_list" rows="4"
        placeholder="เช่น&#10;1. TRAY S&#10;2. Dressing"></textarea>
    </div>

    <div class="btn-row">
      <button class="btn save" onclick="saveData()">💾 บันทึก</button>
      <button class="btn clear" onclick="clearForm()">🗑 ล้าง</button>
    </div>
  </div>

</div>

<!-- HISTORY PAGE -->
<div class="main" id="historyPage" style="display:none;">
  <div class="card">
    <div class="field">
      <label>เลือกเดือน</label>
      <input type="month" id="monthFilter" onchange="loadHistory()">
    </div>
    <button class="btn delete"
      style="width:100%;margin-top:10px;padding:10px;border:none;border-radius:10px;font-family:'Sarabun',sans-serif;font-weight:700;cursor:pointer;"
      onclick="deleteMonthData()">
      🗑 ลบข้อมูลทั้งเดือน
    </button>
  </div>
  <div id="historyList"></div>
</div>

<div id="toast"></div>

<script>
/* =====================================================
   🔥 FIREBASE CONFIG – ใส่ค่าจริงของคุณที่นี่
   =====================================================
   1. ไปที่ https://console.firebase.google.com
   2. เลือก Project → Project Settings → Your Apps
   3. Copy ค่าด้านล่างมาใส่
   ===================================================== */
const firebaseConfig = {
  apiKey:            "AIzaSyBNDLRtOgdYeZiw7MJBnomp5CnS9GkO5oc",
  authDomain:        "medical-supply-beb2c.firebaseapp.com",
  databaseURL:       "https://medical-supply-beb2c-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "medical-supply-beb2c",
  storageBucket:     "medical-supply-beb2c.firebasestorage.app",
  messagingSenderId: "664149641201",
  appId:             "1:664149641201:web:32ad3a63050c7c7c122650",
  measurementId:     "G-VDWP63F75W"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ===== ITEMS ===== */
const ITEMS = [
  ["TRAY S",9],
  ["Dressing",6],
  ["Syringe 50",3],
  ["Set Irrigate",2],
  ["Tube Drain Meter 1.8",10],
  ["Retain Catheter",3],
  ["Set Flush",13],
  ["Suction Container (Crd. Liner 1.5)",5],
  ["Blue pad Extra 90×60",40],
  ["Baby Wipes",5],
  ["กรรไกรตัดไหม",2],
  ["Razor Blade",3],
  ["Finger Tip",5],
  ["Oral Air Way เขียว No.3 – เหลือง No.4","2-3"],
  ["Urine Bag",2],
  ["Aqua Pack 760 ml.",1],
  ["Aqua Pack 340",3],
  ["Oxygen Cannula",5],
  ["Mask With Bag",2],
  ["Set พ่นยา",5],
  ["Bone Marrow ใหญ่ – เล็ก","2-2"],
  ["Pampers Size L",30],
  ["Uro Hat",5],
  ["Urine Container 1100",10],
  ["เข็มขัดพยุงตัวผู้ป่วย",1],
  ["เครื่องชั่ง Pampers",2],
  ["Urinal ชมพู",7],
  ["Urinal ฟ้า",5],
  ["Cold Pack","ใหญ่ 3 เล็ก 1"],
  ["กระเป๋าไฟฟ้า",1],
  ["ที่ชาร์จ – ด้าน AA สีขาว","2-8"],
  ["ปรอทวัดไข้สีขาว",3],
  ["Bed Pan",1]
];

let currentShift = "07-19";

/* ===== TOAST ===== */
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=> t.classList.remove("show"), 2800);
}

/* ===== RENDER TABLE ===== */
function renderTable(){
  let html = "";
  ITEMS.forEach((item, i) => {
    html += `
      <tr>
        <td>${i+1}. ${item[0]}</td>
        <td>${item[1]}</td>
        <td><input class="input" id="count_${i}" type="text" inputmode="decimal"></td>
        <td><input class="input" id="note_${i}" type="text"></td>
      </tr>`;
  });
  document.getElementById("tbody").innerHTML = html;
}

/* ===== SHIFT ===== */
function setShift(shift){
  currentShift = shift;
  document.getElementById("dayBtn").classList.toggle("active", shift==="07-19");
  document.getElementById("nightBtn").classList.toggle("active", shift==="19-07");
}

/* ===== SAVE ===== */
function saveData(){
  const date = document.getElementById("date").value;
  if(!date){ showToast("⚠️ กรุณาเลือกวันที่"); return; }

  const data = {
    date,
    shift: currentShift,
    teamA: document.getElementById("teamA").value,
    teamB: document.getElementById("teamB").value,
    summary: document.querySelector('input[name="summary"]:checked')?.value || "",
    missingList: document.getElementById("missing_list").value,
    items: []
  };

  ITEMS.forEach((item, i) => {
    data.items.push({
      name:  item[0],
      stock: item[1],
      count: document.getElementById(`count_${i}`).value,
      note:  document.getElementById(`note_${i}`).value
    });
  });

  const key = `${date}_${currentShift}`;
  db.ref("medicalSupply/" + key).set(data)
    .then(() => {
      showToast("✅ บันทึกสำเร็จ");
      loadHistory();
    })
    .catch(err => {
      showToast("❌ บันทึกไม่สำเร็จ: " + err.message);
      console.error(err);
    });
}

/* ===== CLEAR ===== */
function clearForm(){
  document.getElementById("teamA").value = "";
  document.getElementById("teamB").value = "";
  document.getElementById("summary_ok").checked = false;
  document.getElementById("summary_ng").checked = false;
  document.getElementById("missing_list").value = "";
  ITEMS.forEach((_, i) => {
    document.getElementById(`count_${i}`).value = "";
    document.getElementById(`note_${i}`).value = "";
  });
  showToast("🗑 ล้างฟอร์มแล้ว");
}

/* ===== SHOW PAGE ===== */
function showPage(page){
  document.getElementById("formPage").style.display    = page==="form"    ? "block" : "none";
  document.getElementById("historyPage").style.display = page==="history" ? "block" : "none";
  document.getElementById("formTab").classList.toggle("active",    page==="form");
  document.getElementById("historyTab").classList.toggle("active", page==="history");
  if(page==="history") loadHistory();
}

/* ===== LOAD HISTORY ===== */
function loadHistory(){
  const month = document.getElementById("monthFilter").value;
  db.ref("medicalSupply").once("value", snap => {
    const data = snap.val();
    if(!data){
      document.getElementById("historyList").innerHTML = "<div class='card'>ไม่มีข้อมูล</div>";
      return;
    }

    let html = "";
    Object.keys(data).reverse().forEach(key => {
      const item = data[key];
      if(month && !item.date.startsWith(month)) return;

      html += `
        <div class="history-card">
          <div class="flex">
            <div>
              <div style="font-weight:800;color:#183153;">📅 ${item.date}</div>
              <div style="font-size:.8rem;color:#64748b;">เวร ${item.shift}</div>
            </div>
            <div style="display:flex;gap:8px;">
              <button class="small-btn edit" onclick="editData('${key}')">แก้ไข</button>
              <button class="small-btn delete" onclick="deleteData('${key}')">ลบ</button>
            </div>
          </div>
          <div style="font-size:.82rem;line-height:1.8;">
            <b>Team A:</b> ${item.teamA||"-"}<br>
            <b>Team B:</b> ${item.teamB||"-"}<br>
            <b>สรุป:</b>
            <span style="font-weight:700;color:${item.summary==='ครบ'?'var(--green)':'var(--red)'}">
              ${item.summary||"-"}
            </span><br>
            <b>รายการที่หาย:</b><br>
            <span style="white-space:pre-line">${item.missingList||"-"}</span>
          </div>
        </div>`;
    });

    document.getElementById("historyList").innerHTML = html || "<div class='card'>ไม่มีข้อมูลในเดือนนี้</div>";
  });
}

/* ===== DELETE ===== */
function deleteData(key){
  if(!confirm("ลบข้อมูลนี้ใช่หรือไม่?")) return;
  db.ref("medicalSupply/" + key).remove()
    .then(() => { showToast("🗑 ลบแล้ว"); loadHistory(); })
    .catch(err => showToast("❌ ลบไม่สำเร็จ"));
}

function deleteMonthData(){
  const month = document.getElementById("monthFilter").value;
  if(!month){ showToast("⚠️ กรุณาเลือกเดือน"); return; }
  if(!confirm(`ลบข้อมูลทั้งหมดของเดือน ${month}?`)) return;

  db.ref("medicalSupply").once("value", snap => {
    const data = snap.val();
    if(!data){ showToast("ไม่มีข้อมูล"); return; }
    const updates = {};
    Object.keys(data).forEach(key => {
      if(data[key].date?.startsWith(month)) updates[key] = null;
    });
    db.ref("medicalSupply").update(updates)
      .then(() => { showToast("🗑 ลบข้อมูลทั้งเดือนแล้ว"); loadHistory(); })
      .catch(err => showToast("❌ ลบไม่สำเร็จ"));
  });
}

/* ===== EDIT ===== */
function editData(key){
  db.ref("medicalSupply/" + key).once("value", snap => {
    const data = snap.val();
    showPage("form");

    document.getElementById("date").value = data.date;
    document.getElementById("teamA").value = data.teamA || "";
    document.getElementById("teamB").value = data.teamB || "";
    document.getElementById("missing_list").value = data.missingList || "";

    document.getElementById("summary_ok").checked = (data.summary === "ครบ");
    document.getElementById("summary_ng").checked = (data.summary === "ไม่ครบ");

    setShift(data.shift);

    if(data.items){
      data.items.forEach((item, i) => {
        const c = document.getElementById(`count_${i}`);
        const n = document.getElementById(`note_${i}`);
        if(c) c.value = item.count || "";
        if(n) n.value = item.note  || "";
      });
    }

    window.scrollTo(0,0);
    showToast("✏️ โหลดข้อมูลสำเร็จ");
  });
}

/* ===== INIT ===== */
document.getElementById("date").value = new Date().toISOString().split("T")[0];
document.getElementById("monthFilter").value = new Date().toISOString().slice(0,7);
renderTable();
</script>

</body>
</html>
